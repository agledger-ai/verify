name: Workflow security (zizmor)

# Static analysis of our own GitHub Actions workflows. Catches credential
# persistence, excessive permissions, template injection, and cache poisoning
# in the CI/release pipeline (the OIDC publish path is the crown-jewel risk).
# Findings surface in the Security tab as SARIF.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
