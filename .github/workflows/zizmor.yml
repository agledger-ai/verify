name: Workflow security (zizmor)

# Static analysis of our own GitHub Actions workflows — catches credential
# persistence, excessive permissions, template injection, and cache poisoning
# in the CI/release pipeline (the OIDC publish path is the crown-jewel risk).
# Findings surface in the Security tab as SARIF.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
