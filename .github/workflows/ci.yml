name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Legal files match their pins, and no retired name appears
        run: |
          grep -v '^#' legal-pins.sha256 | sha256sum --strict -c -
          if git grep -nE 'Agentic Ledger|AOAP|Agentic Operations and Accountability|Agent Health Score|Agentic Contract Spec|®' -- ':!CHANGELOG.md' ':!.github/workflows/ci.yml'; then
            echo "A retired product name or a registered-mark symbol appears outside CHANGELOG.md" >&2
            exit 1
          fi

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify conformance-corpus pin
        # The corpus is the contract with the engine: fixtures are real
        # agledger-api output and change only via deliberate regeneration.
        # This fails on any fixture drift that skipped the lock rewrite.
        run: node scripts/corpus-lock.mjs --check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
