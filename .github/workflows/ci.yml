name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the engines.node floor, supported to 2028-04-30; 26 is LTS from
        # 2026-10-28. Leading on what we TEST costs a job. Leading on what we
        # DECLARE would cost users, which is why engines.node and @types/node
        # stay at 24 until it leaves support.
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Legal files match their pins, and no retired name appears
        run: |
          grep -v '^#' legal-pins.sha256 | sha256sum --strict -c -
          if git grep -nE 'Agentic Ledger|AOAP|Agentic Operations and Accountability|Agent Health Score|Agentic Contract Spec|®' -- ':!CHANGELOG.md' ':!.github/workflows/ci.yml' ':!testdata/conformance'; then
            echo "A retired product name or a registered-mark symbol appears outside CHANGELOG.md" >&2
            exit 1
          fi

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify conformance-corpus pin
        # The corpus is the contract with the engine: fixtures are real
        # agledger-api output and change only via deliberate regeneration.
        # This fails on any fixture drift that skipped the lock rewrite.
        run: node scripts/corpus-lock.mjs --check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
