version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @types/node tracks the LTS runtime we ship to, not the newest Node. This
      # package declares engines.node >=24, and typing against a newer
      # @types/node lets tsc accept APIs that do not exist on the runtime
      # customers actually run. Node 24 (Krypton) is the current Active LTS;
      # Node 26 goes LTS on 2026-10-28. Take the @types/node major once its
      # matching Node line is LTS, not while it is still Current.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
